<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #6200ea;
            color: #ffffff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            background-color: #eeeeee;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #333;
            padding: 10px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #6200ea;
            color: #ffffff;
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        footer {
            background-color: #6200ea;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的个人博客</h1>
    </header>
    <nav>
        <a href="#">首页</a>
        <a href="#">关于我</a>
        <a href="#">博客</a>
        <a href="#">联系</a>
    </nav>
    <div class="container">
        <h2>欢迎来到我的博客</h2>
        <p>这是我的个人博客。在这里我分享我的想法和经验。希望你喜欢！</p>
    </div>
    <footer>
        <p>© 2023 我的个人博客</p>
    </footer>
</body>
</html>
